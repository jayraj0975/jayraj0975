# Railway: one service runs migrations, the web app and the worker together
# (apps/web/scripts/start.ts), with Railway Postgres and a Railway bucket.
# Set the service's root directory to /acquicode and its config file to
# /acquicode/railway.toml. Variables: docs/DEPLOYMENT.md, "Railway".
[build]
builder = "DOCKERFILE"

[deploy]
startCommand = "node dist-node/scripts/start.mjs"
healthcheckPath = "/api/health"
healthcheckTimeout = 180
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
